<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400">
  <defs>
    <style>
      .win-frame { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08)); }
      .title-bar { fill: #003366; }
      .title-text { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 13.5px; font-weight: bold; }
      .tb-sub { fill: #93C5FD; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; }
      .app-toolbar { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .btn-exec { fill: #2E7D32; rx: 4; }
      .btn-exec-text { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: bold; }
      .btn-std { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; rx: 4; }
      .btn-std-text { fill: #1E293B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: 600; }
      .btn-fcode { fill: #64748B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 9.5px; }
      .card-box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; rx: 6; }
      .card-title { fill: #1F4E79; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 12.5px; font-weight: bold; }
      .field-label { fill: #334155; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11.5px; font-weight: 600; }
      .field-req { fill: #DC2626; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 12px; font-weight: bold; }
      .input-box { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-text { fill: #0F172A; font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; }
      .badge-req { fill: #FEE2E2; stroke: #FCA5A5; stroke-width: 1; rx: 3; }
      .badge-req-text { fill: #B91C1C; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: 600; }
      .badge-opt { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; rx: 3; }
      .badge-opt-text { fill: #475569; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; }
      .chk-box { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 3; }
      .chk-text { fill: #0F172A; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11.5px; font-weight: 600; }
      .chk-sub { fill: #64748B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; }
      .status-bar { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; }
      .status-text { fill: #475569; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect x="10" y="10" width="760" height="380" class="win-frame" />

  <!-- Window Header Bar -->
  <path d="M 10 18 Q 10 10 18 10 L 762 10 Q 770 10 770 18 L 770 42 L 10 42 Z" class="title-bar" />
  <circle cx="28" cy="26" r="4.5" fill="#EF4444" />
  <circle cx="42" cy="26" r="4.5" fill="#F59E0B" />
  <circle cx="56" cy="26" r="4.5" fill="#10B981" />
  <text x="75" y="27" class="title-text">/CTDI/PRINT_REPAIR</text>
  <text x="215" y="27" class="tb-sub">— Single Repair Order Printout (Interactive Dispatch)</text>

  <!-- Application Toolbar -->
  <rect x="10" y="42" width="760" height="38" class="app-toolbar" />
  <!-- Execute Button -->
  <rect x="22" y="47" width="105" height="26" class="btn-exec" />
  <polygon points="32,54 32,66 41,60" fill="#FFFFFF" />
  <text x="72" y="64" text-anchor="middle" class="btn-exec-text">Execute (F8)</text>

  <!-- Customizing Buttons -->
  <rect x="137" y="47" width="95" height="26" class="btn-std" />
  <text x="184" y="61" text-anchor="middle" class="btn-std-text">Project</text>
  <text x="184" y="70" text-anchor="middle" class="btn-fcode">(FC02)</text>

  <rect x="242" y="47" width="95" height="26" class="btn-std" />
  <text x="289" y="61" text-anchor="middle" class="btn-std-text">Forms</text>
  <text x="289" y="70" text-anchor="middle" class="btn-fcode">(FC03)</text>

  <rect x="347" y="47" width="95" height="26" class="btn-std" />
  <text x="394" y="61" text-anchor="middle" class="btn-std-text">Results</text>
  <text x="394" y="70" text-anchor="middle" class="btn-fcode">(FC04)</text>

  <!-- Toolbar Separator -->
  <line x1="452" y1="48" x2="452" y2="72" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Mass Printing Shortcut -->
  <rect x="465" y="47" width="135" height="26" class="btn-std" />
  <polygon points="480,52 474,59 478,59 476,67 483,58 479,58" fill="#0D9488" />
  <text x="540" y="61" text-anchor="middle" class="btn-std-text">Mass Printing</text>
  <text x="540" y="70" text-anchor="middle" class="btn-fcode">(FC05)</text>

  <!-- Window Content Canvas -->
  <!-- Box 1: Selection Criteria -->
  <rect x="28" y="96" width="724" height="135" class="card-box" />
  <rect x="28" y="96" width="724" height="28" fill="#F1F5F9" rx="6" />
  <text x="44" y="115" class="card-title">Selection Criteria</text>

  <!-- Field 1: Repair Order -->
  <text x="48" y="152" class="field-label">Repair / Order ID:</text>
  <text x="160" y="152" class="field-req">*</text>
  <rect x="175" y="137" width="180" height="24" class="input-box" />
  <text x="185" y="153" class="input-text">4001234</text>
  <rect x="365" y="139" width="75" height="20" class="badge-req" />
  <text x="402" y="153" text-anchor="middle" class="badge-req-text">Obligatory</text>
  <text x="450" y="153" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="11px">SAP PM/CS Order Number (leading zeros auto-added)</text>

  <!-- Field 2: Serial Number -->
  <text x="48" y="195" class="field-label">Serial Number:</text>
  <rect x="175" y="180" width="180" height="24" class="input-box" />
  <text x="185" y="196" class="input-text">SN-987654321</text>
  <rect x="365" y="182" width="65" height="20" class="badge-opt" />
  <text x="397" y="196" text-anchor="middle" class="badge-opt-text">Optional</text>
  <text x="450" y="196" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="11px">Leave blank to print order master equipment</text>

  <!-- Box 2: Additional Options -->
  <rect x="28" y="246" width="724" height="95" class="card-box" />
  <rect x="28" y="246" width="724" height="28" fill="#F1F5F9" rx="6" />
  <text x="44" y="265" class="card-title">Additional Options &amp; Attachments</text>

  <!-- Checkbox: Images -->
  <rect x="48" y="290" width="16" height="16" class="chk-box" />
  <polyline points="51,298 55,302 61,294" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="74" y="303" class="chk-text">Append attached images to PDF (GOS &amp; ArchiveLink Content Server)</text>
  <text x="74" y="322" class="chk-sub">Automatically extracts defect photos, scales to A4 with aspect ratio preservation, and appends to the final PDF.</text>

  <!-- Status Bar at Bottom -->
  <path d="M 10 360 L 770 360 L 770 382 Q 770 390 762 390 L 18 390 Q 10 390 10 382 Z" class="status-bar" />
  <circle cx="26" cy="375" r="4" fill="#10B981" />
  <text x="36" y="378" class="status-text">Ready  |  System: PRD  |  Output: Spool Default (IW42) / Local File Prompt (Manual)</text>
  <text x="755" y="378" text-anchor="end" class="status-text">SAP GUI / CTDI Repair Framework</text>
</svg>