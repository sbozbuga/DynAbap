<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430">
  <defs>
    <style>
      .win-frame { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08)); }
      .title-bar { fill: #003366; }
      .title-text { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 13.5px; font-weight: bold; }
      .tb-sub { fill: #93C5FD; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; }
      .app-toolbar { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .btn-exec { fill: #2E7D32; rx: 4; }
      .btn-exec-text { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: bold; }
      .btn-var { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; rx: 4; }
      .btn-var-text { fill: #1E293B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: 600; }
      .card-box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; rx: 6; }
      .card-title { fill: #1F4E79; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 12.5px; font-weight: bold; }
      .field-label { fill: #334155; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: 600; }
      .input-box { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-text { fill: #0F172A; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      .btn-multi { fill: #E2E8F0; stroke: #CBD5E1; stroke-width: 1; rx: 3; }
      .chk-box { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 3; }
      .chk-text { fill: #0F172A; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11.5px; font-weight: 600; }
      .chk-sub { fill: #64748B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; }
      .status-bar { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; }
      .status-text { fill: #475569; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="10" y="10" width="760" height="410" class="win-frame" />

  <!-- Window Header Bar -->
  <path d="M 10 18 Q 10 10 18 10 L 762 10 Q 770 10 770 18 L 770 42 L 10 42 Z" class="title-bar" />
  <circle cx="28" cy="26" r="4.5" fill="#EF4444" />
  <circle cx="42" cy="26" r="4.5" fill="#F59E0B" />
  <circle cx="56" cy="26" r="4.5" fill="#10B981" />
  <text x="75" y="27" class="title-text">/CTDI/PRINT_REPAIR_MASS</text>
  <text x="260" y="27" class="tb-sub">— Mass Print Repair Orders (ALV Processing Workplace)</text>

  <!-- Application Toolbar -->
  <rect x="10" y="42" width="760" height="38" class="app-toolbar" />
  <rect x="22" y="47" width="105" height="26" class="btn-exec" />
  <polygon points="32,54 32,66 41,60" fill="#FFFFFF" />
  <text x="72" y="64" text-anchor="middle" class="btn-exec-text">Execute (F8)</text>

  <rect x="137" y="47" width="125" height="26" class="btn-var" />
  <text x="199" y="64" text-anchor="middle" class="btn-var-text">Get Variant... (Ctrl+F5)</text>

  <rect x="272" y="47" width="105" height="26" class="btn-var" />
  <text x="324" y="64" text-anchor="middle" class="btn-var-text">User Parameters</text>

  <!-- Box 1: Selection Criteria -->
  <rect x="28" y="94" width="724" height="205" class="card-box" />
  <rect x="28" y="94" width="724" height="26" fill="#F1F5F9" rx="6" />
  <text x="44" y="112" class="card-title">Selection Criteria (Select-Options)</text>

  <!-- Field 1: Repair Order Range -->
  <text x="48" y="144" class="field-label">Repair Order:</text>
  <rect x="190" y="130" width="130" height="22" class="input-box" />
  <text x="200" y="145" class="input-text">4001000</text>
  <text x="330" y="145" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="11px">to</text>
  <rect x="350" y="130" width="130" height="22" class="input-box" />
  <text x="360" y="145" class="input-text">4001500</text>
  <rect x="490" y="130" width="28" height="22" class="btn-multi" />
  <polygon points="501,138 507,141 501,144" fill="#0F172A" />
  <text x="530" y="145" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">Order range (PM/CS orders)</text>

  <!-- Field 2: Plant -->
  <text x="48" y="174" class="field-label">Plant:</text>
  <rect x="190" y="160" width="80" height="22" class="input-box" />
  <text x="200" y="175" class="input-text">1000</text>
  <rect x="280" y="160" width="28" height="22" class="btn-multi" />
  <polygon points="291,168 297,171 291,174" fill="#0F172A" />
  <text x="320" y="175" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">Malsch Repair Operations Center</text>

  <!-- Field 3: Creation Date Range -->
  <text x="48" y="204" class="field-label">Creation Date:</text>
  <rect x="190" y="190" width="130" height="22" class="input-box" />
  <text x="200" y="205" class="input-text">01.09.2026</text>
  <text x="330" y="205" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="11px">to</text>
  <rect x="350" y="190" width="130" height="22" class="input-box" />
  <text x="360" y="205" class="input-text">21.09.2026</text>
  <rect x="490" y="190" width="28" height="22" class="btn-multi" />
  <polygon points="501,198 507,201 501,204" fill="#0F172A" />

  <!-- Field 4: Order Type -->
  <text x="48" y="234" class="field-label">Order Type:</text>
  <rect x="190" y="220" width="80" height="22" class="input-box" />
  <text x="200" y="235" class="input-text">ZM03</text>
  <rect x="280" y="220" width="28" height="22" class="btn-multi" />
  <polygon points="291,228 297,231 291,234" fill="#0F172A" />
  <text x="320" y="235" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">Standard Customer Repair Order</text>

  <!-- Field 5: Confirmation Reason -->
  <text x="48" y="264" class="field-label">Confirmation Reason:</text>
  <rect x="190" y="250" width="80" height="22" class="input-box" />
  <text x="200" y="265" class="input-text">9010</text>
  <rect x="280" y="250" width="28" height="22" class="btn-multi" />
  <polygon points="291,258 297,261 291,264" fill="#0F172A" />
  <text x="320" y="265" fill="#64748B" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">Repaired &amp; Completed</text>

  <!-- Box 2: Additional Parameters -->
  <rect x="28" y="310" width="724" height="74" class="card-box" />
  <rect x="28" y="310" width="724" height="24" fill="#F1F5F9" rx="6" />
  <text x="44" y="326" class="card-title">Attachment Handling</text>

  <rect x="48" y="345" width="16" height="16" class="chk-box" />
  <polyline points="51,353 55,357 61,349" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="74" y="358" class="chk-text">Append attached images to PDF</text>
  <text x="280" y="358" class="chk-sub">(Evaluates GOS SOFFICE files and Content Server ZRS_JPG photos)</text>

  <!-- Status Bar at Bottom -->
  <path d="M 10 392 L 770 392 L 770 412 Q 770 420 762 420 L 18 420 Q 10 420 10 412 Z" class="status-bar" />
  <circle cx="26" cy="406" r="4" fill="#10B981" />
  <text x="36" y="409" class="status-text">Enter selection parameters and execute (F8) to load orders into ALV Workplace</text>
  <text x="755" y="409" text-anchor="end" class="status-text">CTDI Framework v2.1</text>
</svg>