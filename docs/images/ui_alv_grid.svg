<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430">
  <defs>
    <style>
      .win-frame { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.09)); }
      .title-bar { fill: #003366; }
      .title-text { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 13.5px; font-weight: bold; }
      .title-count { fill: #93C5FD; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11.5px; }
      .alv-toolbar { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
      .btn-act { fill: #1F4E79; rx: 4; }
      .btn-act-txt { fill: #FFFFFF; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 11px; font-weight: bold; }
      .btn-merge { fill: #0284C7; rx: 4; }
      .btn-prev { fill: #475569; rx: 4; }
      .badge-spool { fill: #EDE9FE; stroke: #C4B5FD; stroke-width: 1; rx: 4; }
      .badge-spool-txt { fill: #5B21B6; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: bold; }
      .badge-att { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1; rx: 4; }
      .badge-att-txt { fill: #15803D; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: bold; }
      .badge-raw { fill: #FEF3C7; stroke: #FDE68A; stroke-width: 1; rx: 4; }
      .badge-raw-txt { fill: #B45309; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: bold; }
      
      .th-bg { fill: #E2E8F0; }
      .th-txt { fill: #0F172A; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; font-weight: bold; }
      .row-even { fill: #FFFFFF; }
      .row-odd { fill: #F8FAFC; }
      .row-sel { fill: #EFF6FF; }
      .td-txt { fill: #334155; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10.5px; }
      .td-code { fill: #0F172A; font-family: 'Consolas', monospace; font-size: 10.5px; }
      .td-link { fill: #2563EB; font-family: 'Consolas', monospace; font-size: 10.5px; font-weight: bold; text-decoration: underline; }
      .msg-ok { fill: #15803D; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: 600; }
      .msg-warn { fill: #B45309; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; font-weight: 600; }
      .msg-ready { fill: #64748B; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; }
      
      .foot-bar { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; }
      .foot-txt { fill: #475569; font-family: 'Segoe UI', Calibri, sans-serif; font-size: 10px; }
    </style>
