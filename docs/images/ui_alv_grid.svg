  <circle cx="42" cy="24" r="4.5" fill="#F59E0B" />
  <circle cx="56" cy="24" r="4.5" fill="#10B981" />
  <text x="75" y="27" class="title-text">Mass Print Repair Orders — Interactive ALV Workplace</text>
  <text x="480" y="27" class="title-count">(42 Orders Found • Deduplicated 1 Row / Order)</text>

  <!-- ALV Custom Action Toolbar -->
