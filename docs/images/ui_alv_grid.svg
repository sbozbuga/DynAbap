  <rect x="56" y="250" width="18" height="18" fill="#F0FDF4" stroke="#86EFAC" rx="3" />
  <rect x="60" y="254" width="10" height="8" rx="1" fill="#16A34A" />
  <circle cx="63" cy="256.5" r="1" fill="#FFFFFF" />
  <text x="92" y="264" class="td-link">4001004</text>
  <text x="182" y="264" class="td-code">50008815</text>
  <text x="268" y="264" class="td-link">40000025</text>
  <text x="352" y="264" class="td-link">10005544</text>
  <text x="450" y="264" text-anchor="middle" class="td-txt">30</text>
  <text x="499" y="264" text-anchor="middle" class="td-code">NFF</text>
  <text x="534" y="264" class="td-txt">SmartForms</text>
  <text x="624" y="264" class="td-code">/CTDI/REP_SF</text>
  <!-- Vector Warning Triangle -->
  <polygon points="733,248 738,258 728,258" fill="#D97706" />
  <text x="733" y="257" font-size="8" fill="#FFFFFF" font-weight="bold" text-anchor="middle">!</text>
  <text x="742" y="256" class="msg-warn">Warning: Global fallback used</text>
  <text x="742" y="271" fill="#64748B" font-size="9.5" font-family="'Segoe UI', Calibri, sans-serif">No contract specific rule in REP_FORMS</text>

  <!-- Bottom Legend / Guide Note -->
  <rect x="20" y="295" width="900" height="80" fill="#F8FAFC" stroke="#E2E8F0" rx="6" />
  <text x="35" y="315" fill="#003366" font-family="'Segoe UI', Calibri, sans-serif" font-size="11px" font-weight="bold">ALV Workplace Quick Guide:</text>
  <text x="35" y="333" fill="#334155" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">• <tspan font-weight="bold">Double-Click Navigation:</tspan> Click Order ID → <tspan font-family="Consolas" font-weight="bold">IW33</tspan> | Notification → <tspan font-family="Consolas" font-weight="bold">IW53</tspan> | Contract → <tspan font-family="Consolas" font-weight="bold">VA43</tspan> | Sales Order → <tspan font-family="Consolas" font-weight="bold">VA03</tspan></text>
  <text x="35" y="351" fill="#334155" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">• <tspan font-weight="bold">Attachment Icons:</tspan> Confirmed Content Server defect photos (ZRS_JPG) | General GOS attachments</text>
  <text x="35" y="368" fill="#334155" font-family="'Segoe UI', Calibri, sans-serif" font-size="10.5px">• <tspan font-weight="bold">Batch Execution:</tspan> Select target rows with checkboxes, then click [Print Selected], [Save as PDF], or [PDF Merge].</text>

  <!-- Window Footer -->
  <path d="M 10 385 L 930 385 L 930 412 Q 930 420 922 420 L 18 420 Q 10 420 10 412 Z" class="foot-bar" />
  <text x="25" y="403" class="foot-txt">4 Orders displayed (of 42 loaded)  |  Filter: Plant 1000, Date 01.09.2026 - 21.09.2026  |  Layout: /DEFAULT</text>
  <text x="915" y="403" text-anchor="end" class="foot-txt">Interactive SAP ALV Grid Workplace</text>
</svg>