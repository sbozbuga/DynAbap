  <path d="M 67 170 L 63 174 A 2.5 2.5 0 0 0 66.5 177.5 L 70.5 173.5 A 4 4 0 0 0 65 168 L 61 172" fill="none" stroke="#475569" stroke-width="1.3" stroke-linecap="round" />
