  <text x="92" y="135" class="td-link">4001001</text>
  <text x="182" y="135" class="td-code">50008812</text>
  <text x="268" y="135" class="td-link">40000010</text>
  <text x="352" y="135" class="td-link">10005541</text>
  <text x="450" y="135" text-anchor="middle" class="td-txt">10</text>
  <text x="499" y="135" text-anchor="middle" class="td-code">SCRP</text>
  <text x="534" y="135" class="td-txt">Adobe (ADS)</text>
  <text x="624" y="135" class="td-code">/CTDI/REP_D</text>
