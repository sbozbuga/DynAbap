  <text x="65" y="221" text-anchor="middle" fill="#94A3B8" font-size="10">—</text>
  <text x="92" y="221" class="td-link">4001003</text>
  <text x="182" y="221" class="td-code">50008814</text>
  <text x="268" y="221" class="td-link">40000025</text>
  <text x="352" y="221" class="td-link">10005543</text>
  <text x="450" y="221" text-anchor="middle" class="td-txt">10</text>
  <text x="499" y="221" text-anchor="middle" class="td-code">SWAP</text>
  <text x="534" y="221" class="td-txt">SmartForms</text>
  <text x="624" y="221" class="td-code">/CTDI/REP_SF</text>
