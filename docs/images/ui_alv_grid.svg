  <line x1="46" y1="82" x2="46" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="84" y1="82" x2="84" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="174" y1="82" x2="174" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="260" y1="82" x2="260" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="344" y1="82" x2="344" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="428" y1="82" x2="428" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="472" y1="82" x2="472" y2="385" stroke="#CBD5E1" stroke-width="1" />
  <line x1="526" y1="82" x2="526" y2="385" stroke="#CBD5E1" stroke-width="1" />
